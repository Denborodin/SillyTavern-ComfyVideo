<div class="cv_modal_overlay" id="comfyvideo_panel_overlay">
    <div class="cv_modal" id="comfyvideo_panel" role="dialog" aria-labelledby="comfyvideo_panel_title">
        <div class="cv_modal_header">
            <h3 class="cv_modal_title" id="comfyvideo_panel_title">
                <i class="fa-solid fa-clapperboard"></i>
                ComfyVideo
            </h3>
            <button type="button" class="cv_modal_close" id="comfyvideo_panel_close" title="Close">&times;</button>
        </div>
        <div class="cv_modal_body">

            <div class="cv_panel_section">
                <div class="cv_panel_label">Proportions</div>
                <div class="cv_seg" id="comfyvideo_panel_resolution" role="group">
                    <button type="button" class="cv_seg_btn" data-value="portrait" title="864 × 1152">
                        <i class="fa-solid fa-mobile-screen"></i>
                        <span>Portrait</span>
                        <small>864×1152</small>
                    </button>
                    <button type="button" class="cv_seg_btn" data-value="landscape" title="1152 × 864">
                        <i class="fa-solid fa-panorama"></i>
                        <span>Landscape</span>
                        <small>1152×864</small>
                    </button>
                </div>
                <div class="cv_panel_label">Still quality</div>
                <div class="cv_seg cv_seg_style" id="comfyvideo_panel_image_quality" role="group">
                    <button type="button" class="cv_seg_btn" data-value="compatible">Video-safe<br><small>1×</small></button>
                    <button type="button" class="cv_seg_btn" data-value="high">High<br><small>1.5×</small></button>
                    <button type="button" class="cv_seg_btn" data-value="ultra">Ultra<br><small>2×</small></button>
                </div>
            </div>

            <div class="cv_panel_section">
                <div class="cv_panel_label">Visual style</div>
                <div class="cv_seg cv_seg_style" id="comfyvideo_panel_image_style" role="group">
                    <button type="button" class="cv_seg_btn" data-value="photo">Photo</button>
                    <button type="button" class="cv_seg_btn" data-value="digital_art">Digital art</button>
                    <button type="button" class="cv_seg_btn" data-value="western_comic">Western comic</button>
                </div>
            </div>

            <details class="cv_panel_advanced">
                <summary>Advanced options</summary>
                <div class="cv_panel_section">
                    <div class="cv_panel_label">Video length</div>
                <div class="cv_seg cv_seg_wrap" id="comfyvideo_panel_length" role="group">
                    <button type="button" class="cv_seg_btn" data-seconds="5" data-fps="24" data-frames="124">5s</button>
                    <button type="button" class="cv_seg_btn" data-seconds="8" data-fps="24" data-frames="192">8s</button>
                    <button type="button" class="cv_seg_btn" data-seconds="10" data-fps="24" data-frames="243">10s</button>
                </div>
                    <div class="cv_panel_row cv_panel_custom_len">
                    <label>Frames <input type="number" id="comfyvideo_panel_frames" class="text_pole cv_num" min="1" max="256" /></label>
                    <label>FPS <input type="number" id="comfyvideo_panel_fps" class="text_pole cv_num" min="1" max="60" /></label>
                    <span id="comfyvideo_panel_clip_hint" class="cv_panel_hint"></span>
                    </div>
                </div>

            <div class="cv_panel_section">
                <div class="cv_panel_label">Motion intensity</div>
                <div class="cv_seg cv_seg_style" id="comfyvideo_panel_motion_intensity" role="group">
                    <button type="button" class="cv_seg_btn" data-value="subtle">Subtle</button>
                    <button type="button" class="cv_seg_btn" data-value="normal">Normal</button>
                    <button type="button" class="cv_seg_btn" data-value="energetic">Energetic</button>
                </div>
            </div>
            <div class="cv_panel_section">
                <div class="cv_panel_label">Image workflow</div>
                <select id="comfyvideo_panel_image_wf" class="text_pole"></select>
            </div>
            <div class="cv_panel_section">
                <div class="cv_panel_label">I2V workflow</div>
                <select id="comfyvideo_panel_i2v_wf" class="text_pole"></select>
            </div>
            <div class="cv_panel_section">
                <div class="cv_panel_label">Video gen prompt (LLM instructions)</div>
                <select id="comfyvideo_panel_motion_prompt" class="text_pole"></select>
            </div>

            </details>

            <div class="cv_panel_section cv_panel_actions">
                <div class="cv_panel_label">Generate image</div>
                <div class="cv_image_action_grid" role="group" aria-label="Generate image composition">
                    <button type="button" class="cv_action_btn cv_image_action_btn primary" data-prompt-kind="scene">
                        <i class="fa-solid fa-users"></i>
                        <span>Whole scene</span>
                        <small>All characters</small>
                    </button>
                    <button type="button" class="cv_action_btn cv_image_action_btn primary" data-prompt-kind="portrait">
                        <i class="fa-solid fa-user"></i>
                        <span>Portrait</span>
                        <small>Single character</small>
                    </button>
                    <button type="button" class="cv_action_btn cv_image_action_btn primary" data-prompt-kind="interaction">
                        <i class="fa-solid fa-handshake"></i>
                        <span>Interaction</span>
                        <small>Two-person action</small>
                    </button>
                    <button type="button" class="cv_action_btn cv_image_action_btn primary" data-prompt-kind="environment">
                        <i class="fa-solid fa-panorama"></i>
                        <span>Environment</span>
                        <small>Wide location view</small>
                    </button>
                </div>
                <label class="cv_panel_label" for="comfyvideo_panel_video_source">Video source</label>
                <select id="comfyvideo_panel_video_source" class="text_pole"></select>
                <button type="button" class="cv_action_btn" id="comfyvideo_panel_gen_video">
                    <i class="fa-solid fa-film"></i>
                    Generate video
                </button>
                <p class="cv_panel_hint" id="comfyvideo_panel_video_hint">
                    Video uses the latest ComfyVideo still in this chat (or the selected message’s film button).
                </p>
                <img id="comfyvideo_panel_video_preview" class="cv_panel_video_preview" alt="Still selected for video generation" hidden />
            </div>

            <div class="cv_panel_footer">
                <button type="button" class="cv_link_btn" id="comfyvideo_panel_open_settings">
                    <i class="fa-solid fa-gear"></i> Full settings
                </button>
            </div>
        </div>
    </div>
</div>
